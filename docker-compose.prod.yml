services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${PROD_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${PROD_DB_NAME}
      MARIADB_USER: ${PROD_DB_USERNAME}
      MARIADB_PASSWORD: ${PROD_DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - spring-boot-app-network
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    environment:
      PROD_REDIS_PASSWORD: ${PROD_REDIS_PASSWORD}
    command: [ "sh", "-c", "redis-server --appendonly yes --requirepass \"$${PROD_REDIS_PASSWORD}\"" ]
    volumes:
      - redis-data:/data
    networks:
      - spring-boot-app-network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${PROD_REDIS_PASSWORD}\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  spring-boot-app:
    image: ${APP_IMAGE}
    container_name: spring-boot-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./env.list
    ports:
      - "8080:8080"
    networks:
      - spring-boot-app-network
    volumes:
      - ./application-common.yml:/config/application-common.yml:ro
      - ./application-prod.yml:/config/application-prod.yml:ro
    command: [ "--spring.config.location=/config/application-common.yml,/config/application-prod.yml" ]

networks:
  spring-boot-app-network:
    driver: bridge

volumes:
  mariadb-data:
  redis-data: